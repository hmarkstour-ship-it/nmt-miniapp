<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>НМТ Математика</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #FAFAF8;
    --ink: #1B1B1F;
    --ink-soft: #55555C;
    --line: #E3E3DE;
    --accent: #2F4FD0;
    --accent-soft: #EBEFFC;
    --good: #1E8E5A;
    --good-soft: #E7F5EE;
    --bad: #D6483F;
    --bad-soft: #FBEAE8;
    --radius: 3px;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--paper);
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 24px 24px;
    color: var(--ink);
    padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px);
    min-height: 100%;
  }

  .wrap {
    max-width: 480px;
    margin: 0 auto;
    padding: 20px 18px 40px;
  }

  /* ---- Верхня панель ---- */

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 18px;
  }

  h1 {
    font-size: 17px;
    font-weight: 600;
    margin: 0;
    letter-spacing: -0.01em;
  }

  .streak {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--ink-soft);
    background: #fff;
    border: 1px solid var(--line);
    padding: 4px 9px;
    border-radius: var(--radius);
  }

  /* ---- Вибір теми ---- */

  .topic-select { display: none; }

  .topic-picker {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 15px;
    margin-bottom: 20px;
    background: rgba(255,255,255,.96);
    border: 1px solid var(--line);
    border-radius: 14px;
    color: var(--ink);
    text-align: left;
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(27,27,31,.06);
    transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease;
  }

  .topic-picker:active { transform: scale(.992); }

  .topic-picker-icon {
    width: 42px;
    height: 42px;
    border-radius: 11px;
    background: var(--accent-soft);
    color: var(--accent);
    display: grid;
    place-items: center;
    flex: 0 0 42px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 15px;
    font-weight: 700;
  }

  .topic-picker-copy { min-width: 0; flex: 1; }

  .topic-picker-kicker {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--ink-soft);
    margin-bottom: 3px;
  }

  .topic-picker-title {
    font-size: 16px;
    line-height: 1.25;
    font-weight: 700;
    letter-spacing: -.01em;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .topic-picker-subtitle {
    margin-top: 3px;
    font-size: 12.5px;
    color: var(--ink-soft);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .topic-picker-chevron {
    color: var(--ink-soft);
    font-size: 22px;
    line-height: 1;
    transform: translateY(-1px);
  }

  .topic-overlay {
    position: fixed;
    inset: 0;
    background: rgba(10,10,14,.48);
    backdrop-filter: blur(3px);
    z-index: 50;
    display: none;
    align-items: flex-end;
    justify-content: center;
    padding-top: env(safe-area-inset-top, 0px);
  }

  .topic-overlay.show { display: flex; }

  .topic-sheet {
    width: min(100%, 480px);
    max-height: 82vh;
    background: var(--paper);
    border-radius: 22px 22px 0 0;
    border: 1px solid var(--line);
    border-bottom: 0;
    padding: 10px 14px calc(18px + env(safe-area-inset-bottom, 0px));
    overflow: hidden;
    box-shadow: 0 -16px 50px rgba(0,0,0,.18);
    animation: sheetUp .18s ease-out;
  }

  @keyframes sheetUp {
    from { transform: translateY(18px); opacity: .4; }
    to { transform: translateY(0); opacity: 1; }
  }

  .topic-sheet-handle {
    width: 38px;
    height: 4px;
    border-radius: 999px;
    background: #cfcfd4;
    margin: 2px auto 12px;
  }

  .topic-sheet-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    padding: 0 4px 12px;
  }

  .topic-sheet-title {
    font-size: 19px;
    font-weight: 700;
    letter-spacing: -.02em;
  }

  .topic-sheet-close {
    width: 34px;
    height: 34px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: #fff;
    color: var(--ink);
    font-size: 18px;
    cursor: pointer;
  }

  .topic-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    overflow-y: auto;
    max-height: calc(82vh - 86px);
    padding: 0 2px 4px;
    overscroll-behavior: contain;
  }

  .topic-item {
    width: 100%;
    border: 1px solid var(--line);
    background: #fff;
    border-radius: 13px;
    padding: 12px;
    display: flex;
    align-items: center;
    gap: 12px;
    text-align: left;
    color: var(--ink);
    cursor: pointer;
  }

  .topic-item.active {
    border-color: var(--accent);
    background: var(--accent-soft);
  }

  .topic-item-icon {
    width: 38px;
    height: 38px;
    flex: 0 0 38px;
    display: grid;
    place-items: center;
    border-radius: 10px;
    background: var(--paper);
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    font-weight: 700;
    color: var(--accent);
  }

  .topic-item.active .topic-item-icon { background: #fff; }

  .topic-item-copy { min-width: 0; flex: 1; }

  .topic-item-title {
    font-size: 14.5px;
    font-weight: 650;
    line-height: 1.25;
  }

  .topic-item-subtitle {
    margin-top: 3px;
    font-size: 12px;
    line-height: 1.3;
    color: var(--ink-soft);
  }

  .topic-item-check {
    color: var(--accent);
    font-weight: 700;
    opacity: 0;
  }

  .topic-item.active .topic-item-check { opacity: 1; }

  /* ---- Картка завдання ---- */

  .card {
    background: rgba(255,255,255,.97);
    border: 1px solid rgba(27,27,31,.08);
    border-radius: 20px;
    padding: 22px 18px 18px;
    min-height: 340px;
    display: flex;
    flex-direction: column;
    box-shadow: 0 14px 42px rgba(27,27,31,.07);
  }

  .card-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--ink-soft);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 12px;
  }

  .question-text {
    font-family: "Myriad Pro", "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 16.5px;
    line-height: 1.62;
    margin-bottom: 22px;
    white-space: pre-wrap;
  }

  .question-text .katex,
  .option .katex,
  .explanation .katex {
    font-size: 1.08em;
  }

  .question-text .katex-display,
  .explanation .katex-display {
    margin: 12px 0;
    overflow-x: auto;
    overflow-y: hidden;
    padding: 3px 0;
  }

  .option > span:last-child {
    min-width: 0;
    line-height: 1.5;
  }

  .options {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: auto;
  }

  .option {
    display: flex;
    align-items: center;
    gap: 12px;
    text-align: left;
    padding: 13px 14px;
    min-height: 56px;
    background: #fff;
    border: 1px solid rgba(27,27,31,.10);
    border-radius: 16px;
    font-family: "Myriad Pro", "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 15px;
    color: var(--ink);
    cursor: pointer;
    box-shadow: 0 5px 16px rgba(27,27,31,.035);
    transition: transform .14s ease, border-color .16s ease, background .16s ease, box-shadow .16s ease;
  }

  .option:hover:not(:disabled) {
    border-color: rgba(47,79,208,.45);
    box-shadow: 0 7px 20px rgba(27,27,31,.055);
  }

  .option:active:not(:disabled) { transform: scale(.992); }
  .option:disabled { cursor: default; }

  .option-letter {
    width: 30px;
    height: 30px;
    border-radius: 10px;
    display: grid;
    place-items: center;
    background: #F1F2F4;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    font-weight: 700;
    color: var(--ink-soft);
    flex: 0 0 30px;
    transition: background .16s ease, color .16s ease;
  }

  .option.selected {
    background: #F4F6FF;
    border-color: rgba(47,79,208,.70);
    box-shadow: 0 8px 24px rgba(47,79,208,.10);
  }

  .option.selected .option-letter {
    background: var(--accent);
    color: #fff;
  }

  .option.correct {
    background: var(--good-soft);
    border-color: var(--good);
  }
  .option.correct .option-letter { background: var(--good); color: #fff; }

  .option.wrong {
    background: var(--bad-soft);
    border-color: var(--bad);
  }
  .option.wrong .option-letter { background: var(--bad); color: #fff; }

  /* ---- Пояснення ---- */

  .explanation {
    margin-top: 18px;
    padding: 16px;
    border: 1px solid rgba(27,27,31,.08);
    border-radius: 16px;
    background: #F8F8F6;
    font-size: 14px;
    line-height: 1.58;
    color: var(--ink-soft);
    display: none;
  }

  .explanation.show {
    display: block;
    animation: explanationIn .24s ease-out both;
  }

  @keyframes explanationIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .explanation-title {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 12px;
    color: var(--ink);
    font-size: 15px;
    font-weight: 700;
  }

  .explanation-title-icon {
    width: 28px;
    height: 28px;
    border-radius: 9px;
    display: grid;
    place-items: center;
    background: #ECEEF2;
    font-size: 14px;
  }

  .explanation-steps {
    list-style: none;
    counter-reset: solution-step;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .explanation-step {
    counter-increment: solution-step;
    position: relative;
    padding: 10px 11px 10px 42px;
    min-height: 40px;
    border-radius: 12px;
    background: rgba(255,255,255,.78);
    color: #484B51;
  }

  .explanation-step::before {
    content: counter(solution-step);
    position: absolute;
    left: 10px;
    top: 9px;
    width: 22px;
    height: 22px;
    border-radius: 8px;
    display: grid;
    place-items: center;
    background: #23262B;
    color: #fff;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    font-weight: 700;
  }

  /* ---- Кнопка дії ---- */

  .action-stack {
    display: flex;
    flex-direction: column;
    gap: 9px;
    margin-top: 18px;
  }

  .primary-btn,
  .secondary-btn {
    width: 100%;
    min-height: 50px;
    padding: 13px 15px;
    border-radius: 15px;
    font-family: "Myriad Pro", "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 15.5px;
    font-weight: 650;
    cursor: pointer;
    transition: transform .14s ease, opacity .14s ease, box-shadow .16s ease, background .16s ease;
  }

  .primary-btn {
    background: linear-gradient(180deg, #3458E2 0%, #294BCB 100%);
    color: #fff;
    border: 1px solid rgba(31,61,181,.28);
    box-shadow: 0 9px 24px rgba(47,79,208,.22);
  }

  .primary-btn:active:not(:disabled),
  .secondary-btn:active:not(:disabled) { transform: scale(.992); }

  .primary-btn:disabled {
    background: #E7E8EB;
    border-color: #E2E3E6;
    box-shadow: none;
    color: #95989E;
    cursor: default;
  }

  .secondary-btn {
    background: #F7F7F5;
    color: #3F434A;
    border: 1px solid rgba(27,27,31,.09);
    box-shadow: none;
  }

  .secondary-btn:hover:not(:disabled) { background: #F0F1F2; }
  .secondary-btn:disabled { opacity: .5; cursor: default; }

  /* ---- Стани завантаження / помилки ---- */

  .status {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    min-height: 340px;
    text-align: center;
    color: var(--ink-soft);
    font-size: 14px;
  }

  .spinner {
    width: 22px;
    height: 22px;
    border: 2.5px solid var(--line);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---- Premium startup screen ---- */

  .startup-screen {
    position: fixed;
    inset: 0;
    z-index: 999;
    display: grid;
    place-items: center;
    overflow: hidden;
    padding: calc(24px + env(safe-area-inset-top, 0px)) 24px calc(24px + env(safe-area-inset-bottom, 0px));
    background:
      radial-gradient(circle at 52% 31%, rgba(78, 105, 154, .13), transparent 28%),
      radial-gradient(circle at 12% 88%, rgba(20, 25, 33, .07), transparent 30%),
      linear-gradient(155deg, #f7f7f5 0%, #eeeeec 48%, #e4e6e8 100%);
    font-family: "Myriad Pro", "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    transition: opacity .42s ease, visibility .42s ease;
  }

  .startup-screen.hide {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }

  .startup-screen::before,
  .startup-screen::after {
    content: "";
    position: absolute;
    border-radius: 999px;
    filter: blur(44px);
    opacity: .42;
    pointer-events: none;
  }

  .startup-screen::before {
    width: 220px;
    height: 220px;
    top: -70px;
    right: -80px;
    background: rgba(68, 94, 138, .16);
    animation: startupGlowA 8s ease-in-out infinite alternate;
  }

  .startup-screen::after {
    width: 190px;
    height: 190px;
    bottom: -80px;
    left: -70px;
    background: rgba(25, 28, 34, .10);
    animation: startupGlowB 9s ease-in-out infinite alternate;
  }

  @keyframes startupGlowA {
    from { transform: translate3d(0,0,0) scale(1); }
    to { transform: translate3d(-18px,20px,0) scale(1.08); }
  }

  @keyframes startupGlowB {
    from { transform: translate3d(0,0,0) scale(1); }
    to { transform: translate3d(22px,-18px,0) scale(1.06); }
  }

  .startup-inner {
    position: relative;
    z-index: 2;
    width: min(100%, 360px);
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    animation: startupFadeUp .65s cubic-bezier(.2,.8,.2,1) both;
  }

  @keyframes startupFadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .startup-logo-shell {
    position: relative;
    width: 104px;
    height: 104px;
    margin-bottom: 28px;
    border-radius: 31px;
    display: grid;
    place-items: center;
    background: linear-gradient(145deg, rgba(255,255,255,.88), rgba(255,255,255,.52));
    border: 1px solid rgba(255,255,255,.78);
    box-shadow:
      0 24px 58px rgba(22,25,31,.13),
      inset 0 1px 0 rgba(255,255,255,.92);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    animation: startupFloat 3.2s ease-in-out infinite;
  }

  .startup-logo-shell::after {
    content: "";
    position: absolute;
    inset: 10px;
    border-radius: 23px;
    background: linear-gradient(155deg, rgba(30,35,43,.95), rgba(48,55,66,.88));
    box-shadow: inset 0 1px 0 rgba(255,255,255,.12);
  }

  @keyframes startupFloat {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }

  .startup-robot {
    position: relative;
    z-index: 1;
    font-size: 48px;
    line-height: 1;
    filter: drop-shadow(0 7px 12px rgba(0,0,0,.18));
    transform: translateY(1px);
  }

  .startup-badge {
    margin-bottom: 13px;
    padding: 6px 10px;
    border: 1px solid rgba(26,29,34,.08);
    border-radius: 999px;
    background: rgba(255,255,255,.48);
    color: #73777e;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .08em;
    text-transform: uppercase;
    backdrop-filter: blur(8px);
  }

  .startup-title {
    margin: 0;
    color: #111214;
    font-size: clamp(28px, 7vw, 34px);
    line-height: 1.08;
    font-weight: 700;
    letter-spacing: -.035em;
  }

  .startup-subtitle {
    margin: 11px 0 0;
    color: #71757b;
    font-size: 16px;
    line-height: 1.4;
    font-weight: 400;
    letter-spacing: -.008em;
  }

  .startup-dots {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    margin-top: 27px;
    height: 10px;
  }

  .startup-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #3a4048;
    opacity: .24;
    animation: startupDot 1.25s ease-in-out infinite;
  }

  .startup-dot:nth-child(2) { animation-delay: .16s; }
  .startup-dot:nth-child(3) { animation-delay: .32s; }

  @keyframes startupDot {
    0%, 60%, 100% { transform: translateY(0) scale(.95); opacity: .22; }
    30% { transform: translateY(-4px) scale(1.08); opacity: .86; }
  }

  .startup-note {
    position: absolute;
    left: 0;
    right: 0;
    bottom: calc(24px + env(safe-area-inset-bottom, 0px));
    z-index: 2;
    text-align: center;
    color: rgba(70,74,80,.58);
    font-size: 12px;
    letter-spacing: -.005em;
  }

  @media (prefers-reduced-motion: reduce) {
    .startup-inner,
    .startup-logo-shell,
    .startup-screen::before,
    .startup-screen::after,
    .startup-dot {
      animation: none !important;
    }
  }

  .error-box {
    background: var(--bad-soft);
    border: 1px solid var(--bad);
    color: var(--bad);
    border-radius: var(--radius);
    padding: 12px 14px;
    font-size: 13.5px;
  }
</style>
</head>
<body>

<div class="startup-screen" id="startupScreen" role="status" aria-live="polite">
  <div class="startup-inner">
    <div class="startup-logo-shell" aria-hidden="true">
      <div class="startup-robot">🤖</div>
    </div>
    <div class="startup-badge">NMT · MATHEMATICS</div>
    <h2 class="startup-title">НМТ запускається…</h2>
    <p class="startup-subtitle">Готуємо завдання для тебе ✨</p>
    <div class="startup-dots" aria-hidden="true">
      <span class="startup-dot"></span>
      <span class="startup-dot"></span>
      <span class="startup-dot"></span>
    </div>
  </div>
  <div class="startup-note">Це може зайняти кілька секунд</div>
</div>

<div class="wrap">
  <header>
    <h1>НМТ · Математика</h1>
    <div class="streak" id="streak">✅ 0 · ❌ 0</div>
  </header>

  <select class="topic-select" id="topicSelect" aria-hidden="true" tabindex="-1"></select>

  <button class="topic-picker" id="topicPicker" type="button">
    <div class="topic-picker-icon" id="topicPickerIcon">🎯</div>
    <div class="topic-picker-copy">
      <div class="topic-picker-kicker">Тема підготовки</div>
      <div class="topic-picker-title" id="topicPickerTitle">Змішані завдання НМТ</div>
      <div class="topic-picker-subtitle" id="topicPickerSubtitle">Натисни, щоб обрати тему</div>
    </div>
    <div class="topic-picker-chevron">›</div>
  </button>

  <div id="cardArea">
    <div class="status">
      <div class="spinner"></div>
      <span>Готуємо перше завдання…</span>
    </div>
  </div>
</div>

<div class="topic-overlay" id="topicOverlay" aria-hidden="true">
  <div class="topic-sheet" role="dialog" aria-modal="true" aria-label="Вибір теми НМТ">
    <div class="topic-sheet-handle"></div>
    <div class="topic-sheet-head">
      <div class="topic-sheet-title">Оберіть тему</div>
      <button class="topic-sheet-close" id="topicSheetClose" type="button" aria-label="Закрити">×</button>
    </div>
    <div class="topic-list" id="topicList"></div>
  </div>
</div>

<script>
  const tg = window.Telegram?.WebApp;
  tg?.ready();
  tg?.expand();

  // Бекенд лежить на тому ж домені, що й фронтенд (express.static)
  const API_BASE = '';
  const FETCH_TIMEOUT_MS = 25000;

  async function fetchWithTimeout(url, options = {}) {
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), FETCH_TIMEOUT_MS);
    try {
      return await fetch(url, { ...options, signal: controller.signal });
    } finally {
      clearTimeout(timeout);
    }
  }

  const state = {
    correct: 0,
    wrong: 0,
    currentQuestion: null,
    selectedIndex: null,
    answered: false,
  };

  const cardArea = document.getElementById('cardArea');
  const streakEl = document.getElementById('streak');
  const topicSelect = document.getElementById('topicSelect');
  const topicPicker = document.getElementById('topicPicker');
  const topicPickerIcon = document.getElementById('topicPickerIcon');
  const topicPickerTitle = document.getElementById('topicPickerTitle');
  const topicPickerSubtitle = document.getElementById('topicPickerSubtitle');
  const topicOverlay = document.getElementById('topicOverlay');
  const topicList = document.getElementById('topicList');
  const topicSheetClose = document.getElementById('topicSheetClose');
  const startupScreen = document.getElementById('startupScreen');
  let startupHidden = false;

  function hideStartupScreen() {
    if (startupHidden || !startupScreen) return;
    startupHidden = true;
    startupScreen.classList.add('hide');
    setTimeout(() => startupScreen.remove(), 520);
  }

  function renderMathSafely(root, attempt = 0) {
    if (!root) return;

    if (typeof window.renderMathInElement === 'function') {
      try {
        window.renderMathInElement(root, {
          delimiters: [
            { left: '$$', right: '$$', display: true },
            { left: '\\[', right: '\\]', display: true },
            { left: '\\(', right: '\\)', display: false }
          ],
          throwOnError: false,
          strict: false,
        });
        return;
      } catch (err) {
        console.warn('KaTeX render error:', err);
      }
    }

    // CDN може завантажитися на долю секунди пізніше за основний HTML.
    if (attempt < 20) {
      setTimeout(() => renderMathSafely(root, attempt + 1), 120);
    }
  }


  const FALLBACK_TOPICS = [
    { key: 'mixed', label: '🎯 Змішані завдання НМТ' },
    { key: 'numbers', label: 'Числа та дроби' },
    { key: 'percents', label: 'Відсотки та пропорції' },
    { key: 'powers_roots', label: 'Степені та корені' },
    { key: 'logarithms', label: 'Логарифми' },
    { key: 'equations', label: 'Рівняння' },
    { key: 'inequalities', label: 'Нерівності' },
    { key: 'systems', label: 'Системи рівнянь і нерівностей' },
    { key: 'functions', label: 'Функції та графіки' },
    { key: 'progressions', label: 'Прогресії' },
    { key: 'trigonometry', label: 'Тригонометрія' },
    { key: 'calculus', label: 'Похідна та інтеграл' },
    { key: 'probability_stats', label: 'Ймовірність, комбінаторика та статистика' },
    { key: 'planimetry', label: 'Планіметрія' },
    { key: 'stereometry', label: 'Стереометрія' },
    { key: 'word_problems', label: 'Текстові задачі' },
  ];

  const TOPIC_UI = {
    mixed: { icon: '🎯', subtitle: 'Завдання з усіх тем НМТ' },
    numbers: { icon: '123', subtitle: 'Числа, дроби та обчислення' },
    percents: { icon: '%', subtitle: 'Відсотки, пропорції та практичні задачі' },
    powers_roots: { icon: '√', subtitle: 'Степені, корені та перетворення' },
    logarithms: { icon: 'log', subtitle: 'Логарифми, властивості та рівняння' },
    equations: { icon: 'x=', subtitle: 'Лінійні, квадратні та інші рівняння' },
    inequalities: { icon: '≠', subtitle: 'Нерівності та метод інтервалів' },
    systems: { icon: '{}', subtitle: 'Системи рівнянь і нерівностей' },
    functions: { icon: 'f(x)', subtitle: 'Функції, графіки та їх властивості' },
    progressions: { icon: 'Σ', subtitle: 'Арифметична та геометрична прогресії' },
    trigonometry: { icon: 'sin', subtitle: 'sin, cos, tg і задачі з трикутниками' },
    calculus: { icon: "f′", subtitle: 'Похідна, первісна та інтеграл' },
    probability_stats: { icon: 'P', subtitle: 'Ймовірність, комбінаторика та статистика' },
    planimetry: { icon: '△', subtitle: 'Геометрія на площині' },
    stereometry: { icon: '◇', subtitle: 'Об’єми та геометрія у просторі' },
    word_problems: { icon: '→', subtitle: 'Рух, робота, суміші та моделювання' },
  };

  let loadedTopics = [];

  function updateStreak() {
    streakEl.textContent = `✅ ${state.correct} · ❌ ${state.wrong}`;
  }

  function renderLoading(message) {
    cardArea.innerHTML = `
      <div class="status">
        <div class="spinner"></div>
        <span>${message}</span>
      </div>`;
  }

  function renderError(message) {
    hideStartupScreen();
    cardArea.innerHTML = `
      <div class="card">
        <div class="error-box">${message}</div>
        <button class="primary-btn" id="retryBtn">Спробувати ще раз</button>
      </div>`;
    document.getElementById('retryBtn').addEventListener('click', loadQuestion);
  }

  function getExplanationSteps(q) {
    if (Array.isArray(q?.explanation_steps) && q.explanation_steps.length) {
      return q.explanation_steps;
    }

    if (typeof q?.explanation === 'string' && q.explanation.trim()) {
      const parts = q.explanation
        .split(/\n+|(?=\s*\d+[.)]\s+)/)
        .map((part) => part.replace(/^\s*\d+[.)]\s*/, '').trim())
        .filter(Boolean);

      return parts.length ? parts : [q.explanation.trim()];
    }

    return ['Розв’язання для цього завдання не надійшло.'];
  }

  function renderQuestion(q) {
    hideStartupScreen();
    state.currentQuestion = q;
    state.selectedIndex = null;
    state.answered = false;

    if (q.progress) {
      state.correct = Number(q.progress.correct) || 0;
      state.wrong = Number(q.progress.wrong) || 0;
      updateStreak();
      console.log('PROGRESS LOADED:', q.progress);
    }

    const letters = ['А', 'Б', 'В', 'Г', 'Д'];
    const explanationSteps = getExplanationSteps(q);

    cardArea.innerHTML = `
      <div class="card">
        <div class="card-label">${topicSelect.options[topicSelect.selectedIndex]?.text || ''}</div>
        <div class="question-text">${escapeHtml(q.question)}</div>
        <div class="options">
          ${q.options.map((opt, i) => `
            <button class="option" data-index="${i}" type="button">
              <span class="option-letter">${letters[i]}</span>
              <span>${escapeHtml(opt)}</span>
            </button>
          `).join('')}
        </div>
        <div class="explanation" id="explanation">
          <div class="explanation-title">
            <span class="explanation-title-icon">✦</span>
            <span>Розв’язання</span>
          </div>
          <ol class="explanation-steps">
            ${explanationSteps.map((step) => `
              <li class="explanation-step">${escapeHtml(step)}</li>
            `).join('')}
          </ol>
        </div>
        <div class="action-stack">
          <button class="primary-btn" id="checkBtn" type="button" disabled>Перевірити відповідь</button>
          <button class="secondary-btn" id="regenerateBtn" type="button">↻ Перегенерувати завдання</button>
        </div>
      </div>`;

    renderMathSafely(cardArea);

    cardArea.querySelectorAll('.option').forEach((btn) => {
      btn.addEventListener('click', () => selectAnswer(Number(btn.dataset.index)));
    });

    document.getElementById('checkBtn').addEventListener('click', () => {
      if (state.answered) loadQuestion();
      else submitAnswer();
    });

    document.getElementById('regenerateBtn').addEventListener('click', () => {
      tg?.HapticFeedback?.impactOccurred?.('light');
      loadQuestion();
    });
  }

  function selectAnswer(selectedIndex) {
    if (state.answered) return;

    state.selectedIndex = selectedIndex;
    const options = cardArea.querySelectorAll('.option');

    options.forEach((btn) => {
      btn.classList.toggle('selected', Number(btn.dataset.index) === selectedIndex);
    });

    const checkBtn = document.getElementById('checkBtn');
    checkBtn.disabled = false;
    checkBtn.textContent = 'Перевірити відповідь';

    tg?.HapticFeedback?.selectionChanged?.();
  }

  async function submitAnswer() {
    if (state.answered || state.selectedIndex === null) return;

    state.answered = true;

    const selectedIndex = state.selectedIndex;
    const q = state.currentQuestion;
    const options = cardArea.querySelectorAll('.option');
    const checkBtn = document.getElementById('checkBtn');
    const regenerateBtn = document.getElementById('regenerateBtn');

    checkBtn.disabled = true;
    regenerateBtn.disabled = true;
    options.forEach((btn) => {
      btn.disabled = true;
      btn.classList.remove('selected');
    });

    const isCorrect = selectedIndex === q.correct_index;

    options[selectedIndex].classList.add(isCorrect ? 'correct' : 'wrong');
    if (!isCorrect) options[q.correct_index].classList.add('correct');

    if (isCorrect) {
      tg?.HapticFeedback?.notificationOccurred('success');
    } else {
      tg?.HapticFeedback?.notificationOccurred('error');
    }

    try {
      const res = await fetchWithTimeout(`${API_BASE}/api/answer`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          initData: tg?.initData || null,
          isCorrect
        }),
      });

      const data = await res.json();

      if (data.saved) {
        state.correct = Number(data.correct_count) || 0;
        state.wrong = Number(data.wrong_count) || 0;
      } else {
        if (isCorrect) state.correct++;
        else state.wrong++;
      }
    } catch (err) {
      console.warn('Не вдалося зберегти відповідь:', err);
      if (isCorrect) state.correct++;
      else state.wrong++;
    }

    updateStreak();

    document.getElementById('explanation').classList.add('show');
    renderMathSafely(document.getElementById('explanation'));

    checkBtn.disabled = false;
    checkBtn.textContent = 'Наступне завдання →';
    regenerateBtn.disabled = false;
    regenerateBtn.textContent = '↻ Інше завдання';
  }

  async function loadQuestion() {
    renderLoading('Генеруємо завдання…');
    try {
      const res = await fetchWithTimeout(`${API_BASE}/api/generate-question`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          topic: topicSelect.value,
          difficulty: 'середній',
          verify: true,
          initData: tg?.initData || null,
        }),
      });

      const data = await res.json();

      if (!res.ok) {
        renderError(data.error || 'Щось пішло не так. Спробуйте ще раз.');
        return;
      }

      renderQuestion(data);
    } catch (err) {
      if (err.name === 'AbortError') {
        renderError('Сервер не відповів вчасно (тайм-аут). Спробуйте ще раз.');
      } else {
        renderError('Немає з\'єднання з сервером. Перевірте, чи запущений бекенд.');
      }
    }
  }

  const sleepMs = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

  async function getTelegramInitData() {
    // Чекаємо до 3 секунд, поки Telegram віддасть initData
    for (let i = 0; i < 30; i++) {
      const initData = tg?.initData || '';

      if (initData.length > 0) {
        console.log('Telegram initData ready:', initData.length);
        return initData;
      }

      await sleepMs(100);
    }

    return tg?.initData || '';
  }

  async function loadProgress() {
    try {
      const initData = await getTelegramInitData();

      console.log('LOAD PROGRESS initData:', initData.length);

      if (!initData) {
        console.warn('Telegram initData порожній — прогрес поки не завантажено');
        return false;
      }

      const res = await fetchWithTimeout(`${API_BASE}/api/progress`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          initData
        }),
      });

      const data = await res.json();

      console.log('PROGRESS FROM SERVER:', data);

      if (!res.ok) {
        throw new Error('Помилка /api/progress');
      }

      state.correct = Number(data.correct ?? 0);
      state.wrong = Number(data.wrong ?? 0);

      updateStreak();

      return true;

    } catch (err) {
      console.error('Помилка завантаження прогресу:', err);
      return false;
    }
  }

  function getTopicUi(key) {
    return TOPIC_UI[key] || { icon: '•', subtitle: 'Тренування в межах програми НМТ' };
  }

  function stripLeadingEmoji(label = '') {
    return label.replace(/^🎯\s*/, '').trim();
  }

  function syncTopicPicker() {
    const selected = loadedTopics.find((t) => t.key === topicSelect.value) || loadedTopics[0];
    if (!selected) return;

    const ui = getTopicUi(selected.key);
    topicPickerIcon.textContent = ui.icon;
    topicPickerTitle.textContent = stripLeadingEmoji(selected.label);
    topicPickerSubtitle.textContent = ui.subtitle;

    topicList.querySelectorAll('.topic-item').forEach((item) => {
      item.classList.toggle('active', item.dataset.key === selected.key);
    });
  }

  function renderTopicList() {
    topicList.innerHTML = loadedTopics.map((t) => {
      const ui = getTopicUi(t.key);
      return `
        <button class="topic-item" type="button" data-key="${escapeHtml(t.key)}">
          <span class="topic-item-icon">${escapeHtml(ui.icon)}</span>
          <span class="topic-item-copy">
            <span class="topic-item-title">${escapeHtml(stripLeadingEmoji(t.label))}</span>
            <span class="topic-item-subtitle">${escapeHtml(ui.subtitle)}</span>
          </span>
          <span class="topic-item-check">✓</span>
        </button>`;
    }).join('');

    topicList.querySelectorAll('.topic-item').forEach((btn) => {
      btn.addEventListener('click', async () => {
        if (btn.dataset.key === topicSelect.value) {
          closeTopicSheet();
          return;
        }

        topicSelect.value = btn.dataset.key;
        try { localStorage.setItem('nmt_topic', topicSelect.value); } catch (_) {}
        syncTopicPicker();
        closeTopicSheet();
        tg?.HapticFeedback?.selectionChanged?.();
        await loadQuestion();
      });
    });

    syncTopicPicker();
  }

  function openTopicSheet() {
    topicOverlay.classList.add('show');
    topicOverlay.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
    syncTopicPicker();
  }

  function closeTopicSheet() {
    topicOverlay.classList.remove('show');
    topicOverlay.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
  }

  topicPicker.addEventListener('click', openTopicSheet);
  topicSheetClose.addEventListener('click', closeTopicSheet);
  topicOverlay.addEventListener('click', (event) => {
    if (event.target === topicOverlay) closeTopicSheet();
  });

  async function loadTopics() {
    let topics = FALLBACK_TOPICS;

    try {
      const res = await fetchWithTimeout(`${API_BASE}/api/topics?v=3`, { cache: 'no-store' });
      if (!res.ok) throw new Error('Помилка /api/topics');

      const freshTopics = await res.json();
      if (Array.isArray(freshTopics) && freshTopics.some((t) => t.key === 'logarithms')) {
        topics = freshTopics;
      } else {
        console.warn('Отримано застарілий список тем — використовую актуальний локальний список.');
      }
    } catch (err) {
      console.error('Помилка завантаження тем:', err);
    }

    loadedTopics = topics;
    topicSelect.innerHTML = loadedTopics
      .map((t) => `<option value="${escapeHtml(t.key)}">${escapeHtml(t.label)}</option>`)
      .join('');

    let savedTopic = '';
    try { savedTopic = localStorage.getItem('nmt_topic') || ''; } catch (_) {}

    if (savedTopic && loadedTopics.some((t) => t.key === savedTopic)) {
      topicSelect.value = savedTopic;
    } else if (loadedTopics.some((t) => t.key === 'mixed')) {
      topicSelect.value = 'mixed';
    }

    renderTopicList();
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str ?? '';
    return div.innerHTML;
  }

  (async function init() {
    await loadTopics();

    // Спочатку намагаємось підтягнути збережений прогрес
    const progressLoaded = await loadProgress();

    // Потім генеруємо перше питання
    await loadQuestion();

    // Якщо Telegram не встиг віддати initData —
    // пробуємо підтягнути прогрес ще раз
    if (!progressLoaded) {
      await loadProgress();
    }
  })();

</script>

</body>
</html>
